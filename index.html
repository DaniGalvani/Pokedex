<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icons/pikachu.png" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body onload="displayAllPokemon()">
    <header class="header-container" id="header">
      <div class="header">
        <div class="img-container">
          <img
            src="./assets/img/pokemon_ball.png"
            alt="Pokeball Icon"
            class="header-icon"
          />
          <h1>Pokedex</h1>
          <img
            src="./assets/img/pokemon_ball.png"
            alt="Pokeball Icon"
            class="header-icon"
          />
        </div>
        <p>
          Willkommen im Pokedex! Hier findest du Informationen zu deinen
          Lieblings-Pokémon.
        </p>
        <p class="fs-24">
          Klicke auf dein Lieblings-Pokémon, um mehr Details zu erfahren.
        </p>
        <div class="search-bar">
          <input
            class="input"
            type="text"
            id="search-input"
            placeholder="Suche dein Pokémon..."
            oninput="searchPokemon()"
          />
        </div>
      </div>
    </header>
    <div class="content" id="content-cards"></div>
    <div class="btn-flex">
      <button class="load-more-btn" id="load-more-btn" onclick="loadMorePokemon()">
        + 20 Pokémon
      </button>
      <a href="#header">
      <button class="reset-btn" id="top-btn">
        nach oben
      </button>
      </a>
      <button class="reset-btn" id="reset-btn" onclick="resetDisplayPokemon()" hidden>Zurücksetzen</button>
    </div>
    <div class="popup" id="popup">
      <div class="popup-card" id="popup-card">
        <button class="close-btn" onclick="closePopupCard()"><img src="./assets/icons/close.png" alt="Close Button"></button>
        <div id="popup-card-info" class="popup-card-info"></div>
      </div>
    </div>
    <div class="spinner-container">
      <div class="spinner" id="spinner"></div>
    </div>
    <script src="script.js"></script>
    <script src="./scripts/templates.js"></script>
  </body>
</html>
