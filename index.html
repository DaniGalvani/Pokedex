<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icons/pikachu.png" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body onload="displayAllPokemon()">
    <div class="container">
      <div class="header">
        <h1>Pokedex</h1>
        <p>
          Willkommen im Pokedex! Hier findest du Informationen zu deinen
          Lieblings-Pokémon.
        </p>
        <div class="search-bar">
          <input class="input"
            type="text"
            id="search-input"
            placeholder="Suche nach Pokémon..."
            oninput="searchPokemon()"
          />
        </div>
      </div>
    </div>
    <div class="content" id="content-cards"></div>
    <script src="./scripts/templates.js"></script>
    <script src="script.js"></script>
  </body>
</html>
